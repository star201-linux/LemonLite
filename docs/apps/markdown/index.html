<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Markdown 预览</title>
<style>
  /* ==========================================================================
     Markdown 预览 —— LemonLite 小程序
     --------------------------------------------------------------------------
     左侧（窄屏时在上方）是输入框，右侧是渲染结果。
     渲染样式全部走 --md-* 变量，所以正文会跟着宿主主题走。
     ========================================================================== */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--md-surface, #fef7ff);
    color: var(--md-on-surface, #1d1b20);
    font-family: -apple-system, "Roboto", "Noto Sans SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .muted { color: var(--md-on-surface-variant, #49454f); font-size: 13px; margin: 0; }

  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 8px; }

  .toolbar button {
    padding: 7px 12px;
    font: inherit;
    font-size: 13px;
    border: none;
    border-radius: 999px;
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }

  .panes { display: grid; gap: 12px; }

  textarea {
    width: 100%;
    min-height: 240px;
    resize: vertical;
    padding: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--md-on-surface, #1d1b20);
    background: var(--md-surface-container-highest, #e6e0e9);
    border: 1px solid var(--md-outline-variant, #cac4d0);
    border-radius: 14px;
    outline: none;
  }
  textarea:focus { border-color: var(--md-primary, #6750a4); }

  #preview {
    padding: 16px;
    border-radius: 14px;
    background: var(--md-surface-container, #f3edf7);
    border: 1px solid var(--md-outline-variant, #cac4d0);
    min-height: 160px;
    overflow-wrap: break-word;
  }

  /* ---------------- 渲染出来的排版 ---------------- */

  #preview > :first-child { margin-top: 0; }
  #preview > :last-child { margin-bottom: 0; }

  .md-h1 { font-size: 24px; margin: 18px 0 10px; font-weight: 600; }
  .md-h2 { font-size: 20px; margin: 16px 0 8px; font-weight: 600; }
  .md-h3 { font-size: 17px; margin: 14px 0 6px; font-weight: 600; }
  .md-h4, .md-h5, .md-h6 { font-size: 15px; margin: 12px 0 6px; font-weight: 600;
                           color: var(--md-on-surface-variant, #49454f); }

  .md-p { margin: 0 0 10px; }

  .md-quote {
    margin: 0 0 10px;
    padding: 4px 0 4px 12px;
    border-left: 3px solid var(--md-primary, #6750a4);
    color: var(--md-on-surface-variant, #49454f);
  }

  .md-list { margin: 0 0 10px; padding-left: 22px; }
  .md-list li { margin: 2px 0; }

  .md-hr { border: none; border-top: 1px solid var(--md-outline-variant, #cac4d0); margin: 16px 0; }

  .md-code {
    padding: 2px 6px;
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .88em;
    background: var(--md-surface-container-highest, #e6e0e9);
  }

  .md-pre {
    margin: 0 0 10px;
    padding: 12px 14px;
    border-radius: 12px;
    overflow-x: auto;
    background: var(--md-surface-container-highest, #e6e0e9);
  }
  .md-pre code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre;
  }
  .md-pre code[data-lang]::before {
    content: attr(data-lang);
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    opacity: .65;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .md-link { color: var(--md-primary, #6750a4); }
  .md-img { max-width: 100%; border-radius: 10px; display: block; }

  .status {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }

  #no-bridge {
    display: none;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: var(--md-tertiary-container, #ffd8e4);
    color: var(--md-on-tertiary-container, #31111d);
  }

  footer { margin-top: 18px; font-size: 12px; color: var(--md-on-surface-variant, #49454f); }

  /* 宽屏并排；窄屏上下堆叠（手机上并排两边都太窄，反而不好用） */
  @media (min-width: 720px) {
    .panes { grid-template-columns: 1fr 1fr; align-items: start; }
    textarea { min-height: 420px; }
  }
</style>
</head>
<body>

<h1>Markdown 预览</h1>
<p class="muted">左边写，右边看。草稿会自动存进宿主的本地存储。</p>

<div id="no-bridge">未检测到 window.lemonlite —— 草稿不会被保存，链接会用新窗口打开。</div>

<div class="toolbar">
  <button data-insert="h2">标题</button>
  <button data-insert="bold">粗体</button>
  <button data-insert="italic">斜体</button>
  <button data-insert="code">行内代码</button>
  <button data-insert="list">列表</button>
  <button data-insert="quote">引用</button>
  <button data-insert="link">链接</button>
  <button data-insert="fence">代码块</button>
</div>

<div class="panes">
  <textarea id="src" spellcheck="false" placeholder="在这里写 Markdown…"></textarea>
  <div id="preview"></div>
</div>

<div class="status">
  <span class="chip" id="stat-chars">0 字</span>
  <span class="chip" id="stat-lines">0 行</span>
  <span class="chip" id="stat-words">0 词</span>
  <span class="chip" id="stat-saved">草稿未保存</span>
</div>

<footer>
  支持：标题、粗体、斜体、删除线、行内代码、代码块、有序/无序列表、引用、分割线、链接、图片。
  不支持表格与嵌套列表 —— 与其做一个边界行为诡异的解析器，不如把子集做对。
</footer>

<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
