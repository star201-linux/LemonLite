<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>天气卡片</title>
<style>
  /* ==========================================================================
     天气卡片 —— LemonLite 小程序
     --------------------------------------------------------------------------
     两种形态：
       白天卡 —— 用宿主的 surface / primary 系列
       夜间卡 —— 用 inverse-surface 系列（深底浅字）
     触发条件是「当地是夜里」或「宿主主题是深色」。后者尤其重要：深色主题下
     一张亮色卡片会非常刺眼，让它跟主题一起沉下去才对。
     ========================================================================== */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--md-surface, #fef7ff);
    color: var(--md-on-surface, #1d1b20);
    font-family: -apple-system, "Roboto", "Noto Sans SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .muted { color: var(--md-on-surface-variant, #49454f); font-size: 13px; margin: 0; }

  .cities { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 0; }

  .cities button {
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    border: none;
    border-radius: 999px;
    background: var(--md-surface-container, #f3edf7);
    color: var(--md-on-surface-variant, #49454f);
  }
  .cities button.active {
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
    font-weight: 600;
  }

  /* ---------------- 卡片 ---------------- */

  .card {
    margin-top: 14px;
    padding: 22px 20px;
    border-radius: 20px;
    background: var(--md-primary-container, #eaddff);
    color: var(--md-on-primary-container, #21005d);
    transition: background-color .3s ease, color .3s ease;
  }

  /* 夜间形态 */
  .card.night {
    background: var(--md-inverse-surface, #322f35);
    color: var(--md-on-inverse-surface, #f5eff7);
  }

  .card-top { display: flex; align-items: center; gap: 16px; }

  .icon { flex: none; width: 72px; height: 72px; }
  .icon svg { width: 100%; height: 100%; display: block; }

  .temp {
    font-size: 46px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label { font-size: 15px; opacity: .85; margin-top: 4px; }

  .meta {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid currentColor;
    opacity: .8;
    font-size: 13px;
  }
  .meta b { font-weight: 600; }

  .foot { margin-top: 12px; font-size: 12px; opacity: .7; }

  /* ---------------- 状态 ---------------- */

  #error {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: var(--md-error-container, #f9dedc);
    color: var(--md-on-error-container, #410e0b);
  }

  .row { display: flex; gap: 8px; margin-top: 14px; }

  button.primary {
    flex: 1;
    padding: 13px 16px;
    font: inherit;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    background: var(--md-primary, #6750a4);
    color: var(--md-on-primary, #fff);
  }

  #no-bridge {
    display: none;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: var(--md-tertiary-container, #ffd8e4);
    color: var(--md-on-tertiary-container, #31111d);
  }

  footer { margin-top: 18px; font-size: 12px; color: var(--md-on-surface-variant, #49454f); }
</style>
</head>
<body>

<h1>天气卡片</h1>
<p class="muted">一张卡片的大小。配色跟随宿主主题，深色模式下自动换成夜间形态。</p>

<div id="no-bridge">未检测到 window.lemonlite —— 用普通浏览器打开时改走 fetch（Open-Meteo 允许跨域），功能正常。</div>

<div class="cities" id="cities"></div>

<div class="card" id="card">
  <div class="card-top">
    <div class="icon" id="icon"></div>
    <div>
      <div class="temp" id="temp">--</div>
      <div class="label" id="label">正在获取…</div>
    </div>
  </div>
  <div class="meta">
    <div>体感 <b id="apparent">--</b></div>
    <div>湿度 <b id="humidity">--</b></div>
    <div>风速 <b id="wind">--</b></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div id="error"></div>

<div class="row">
  <button class="primary" id="btn-refresh">刷新</button>
</div>

<footer>
  数据来自 Open-Meteo（免注册、无 key）。请求走宿主的 <code>lemonlite.request</code>，
  由 Flutter 侧的 dio 发出，不受浏览器跨域限制；抓到的结果会缓存到宿主存储，
  断网时至少还能看到上一次的数据。
</footer>

<script src="weather.js"></script>
<script src="app.js"></script>
</body>
</html>
