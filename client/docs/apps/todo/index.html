<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>轻记事</title>
<style>
  /* ==========================================================================
     轻记事 —— LemonLite 小程序
     --------------------------------------------------------------------------
     配色全部走宿主注入的 --md-* 变量，跟随浅色/深色/动态壁纸色。
     ========================================================================== */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--md-surface, #fef7ff);
    color: var(--md-on-surface, #1d1b20);
    font-family: -apple-system, "Roboto", "Noto Sans SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .muted { color: var(--md-on-surface-variant, #49454f); font-size: 13px; margin: 0; }

  .composer { display: flex; gap: 8px; margin: 16px 0 12px; }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font: inherit;
    font-size: 14px;
    color: var(--md-on-surface, #1d1b20);
    background: var(--md-surface-container-highest, #e6e0e9);
    border: 1px solid var(--md-outline-variant, #cac4d0);
    border-radius: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--md-primary, #6750a4); }

  button {
    padding: 12px 18px;
    font: inherit;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    background: var(--md-primary, #6750a4);
    color: var(--md-on-primary, #fff);
    white-space: nowrap;
  }
  button.tonal {
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }
  button:disabled { opacity: .45; }

  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

  .filters button {
    padding: 7px 14px;
    font-size: 13px;
    background: var(--md-surface-container, #f3edf7);
    color: var(--md-on-surface-variant, #49454f);
  }
  .filters button.active {
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
    font-weight: 600;
  }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 14px;
    background: var(--md-surface-container, #f3edf7);
  }

  .check {
    flex: none;
    width: 22px;
    height: 22px;
    margin-top: 2px;
    border-radius: 50%;
    border: 2px solid var(--md-outline, #79747e);
    background: transparent;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    color: transparent;
  }
  li.done .check {
    background: var(--md-primary, #6750a4);
    border-color: var(--md-primary, #6750a4);
    /* 色块上的勾必须是白的 —— 这是本项目允许写死颜色的两处之一 */
    color: #ffffff;
  }

  .text { flex: 1; min-width: 0; overflow-wrap: break-word; }
  li.done .text { text-decoration: line-through; color: var(--md-on-surface-variant, #49454f); }

  .del {
    flex: none;
    padding: 4px 8px;
    font-size: 13px;
    background: transparent;
    color: var(--md-on-surface-variant, #49454f);
  }

  .empty {
    padding: 32px 16px;
    text-align: center;
    border-radius: 14px;
    background: var(--md-surface-container, #f3edf7);
    color: var(--md-on-surface-variant, #49454f);
    font-size: 14px;
  }

  .status {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 14px;
  }
  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }

  #no-bridge {
    display: none;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: var(--md-tertiary-container, #ffd8e4);
    color: var(--md-on-tertiary-container, #31111d);
  }

  footer { margin-top: 18px; font-size: 12px; color: var(--md-on-surface-variant, #49454f); }
</style>
</head>
<body>

<h1>轻记事</h1>
<p class="muted">数据存在宿主的本地存储里，按小程序隔离。换个 App 装同一份数据不会串。</p>

<div id="no-bridge">未检测到 window.lemonlite —— 你可能是用普通浏览器打开的，功能可用，但关掉页面数据就没了。</div>

<div class="composer">
  <input type="text" id="input" placeholder="记点什么…" maxlength="200" autocomplete="off" />
  <button id="btn-add">添加</button>
</div>

<div class="filters">
  <button data-filter="all" class="active">全部</button>
  <button data-filter="active">未完成</button>
  <button data-filter="done">已完成</button>
</div>

<ul id="list"></ul>

<div class="status">
  <span class="chip" id="stat">还没有条目</span>
  <button id="btn-clear" class="tonal" style="margin-left:auto;padding:7px 14px;font-size:13px">清除已完成</button>
</div>

<footer>
  从存储里读出来的数据一律先过一遍清洗：字段类型不对、内容为空、id 重复的条目会被丢掉。
  那份数据可能来自旧版本，直接当成合法结构用，一个脏字段就能让整个列表渲染不出来。
</footer>

<script src="todo.js"></script>
<script src="app.js"></script>
</body>
</html>
