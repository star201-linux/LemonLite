<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>番茄钟</title>
<style>
  /* ==========================================================================
     番茄钟 —— LemonLite 小程序
     --------------------------------------------------------------------------
     配色全部走宿主注入的 --md-* 变量；专注阶段用 primary，休息阶段用 tertiary，
     所以切主题色 / 切深色模式时整个计时器都会跟着变。
     ========================================================================== */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--md-surface, #fef7ff);
    color: var(--md-on-surface, #1d1b20);
    font-family: -apple-system, "Roboto", "Noto Sans SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }

  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; text-align: left; }
  .muted { color: var(--md-on-surface-variant, #49454f); font-size: 13px; margin: 0; text-align: left; }

  .dial { position: relative; width: 220px; height: 220px; margin: 20px auto 8px; }

  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .dial .track { fill: none; stroke: var(--md-surface-container-highest, #e6e0e9); stroke-width: 12; }

  .dial .bar {
    fill: none;
    stroke: var(--md-primary, #6750a4);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset .3s linear, stroke .3s ease;
  }
  body.break .dial .bar { stroke: var(--md-tertiary, #7d5260); }

  .dial .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .clock { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }

  .phase {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .5px;
    color: var(--md-primary, #6750a4);
  }
  body.break .phase { color: var(--md-tertiary, #7d5260); }

  .row { display: flex; gap: 8px; margin-top: 14px; }

  button {
    flex: 1;
    padding: 13px 16px;
    font: inherit;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    background: var(--md-primary, #6750a4);
    color: var(--md-on-primary, #fff);
  }
  button.tonal {
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }

  .card {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 16px;
    background: var(--md-surface-container, #f3edf7);
    text-align: left;
  }

  .card h2 { font-size: 13px; margin: 0 0 10px; font-weight: 600; letter-spacing: .4px;
             text-transform: uppercase; color: var(--md-primary, #6750a4); }

  .lengths { display: flex; gap: 6px; flex-wrap: wrap; }

  .lengths button {
    flex: 0 1 auto;
    padding: 8px 14px;
    font-size: 13px;
    background: var(--md-surface-container-highest, #e6e0e9);
    color: var(--md-on-surface, #1d1b20);
  }
  .lengths button.active {
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
    font-weight: 600;
  }

  .status { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }

  #no-bridge {
    display: none;
    margin: 12px 0;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    text-align: left;
    background: var(--md-tertiary-container, #ffd8e4);
    color: var(--md-on-tertiary-container, #31111d);
  }

  footer { margin-top: 18px; font-size: 12px; color: var(--md-on-surface-variant, #49454f); text-align: left; }
</style>
</head>
<body>

<h1>番茄钟</h1>
<p class="muted">25 分钟专注 + 5 分钟休息，一轮结束会用宿主原生的提示条提醒你。</p>

<div id="no-bridge">未检测到 window.lemonlite —— 用普通浏览器打开时没有原生提示条，计时本身不受影响。</div>

<div class="dial">
  <svg viewBox="0 0 220 220" aria-hidden="true">
    <circle class="track" cx="110" cy="110" r="96"></circle>
    <circle class="bar" id="bar" cx="110" cy="110" r="96" stroke-dasharray="603.19" stroke-dashoffset="603.19"></circle>
  </svg>
  <div class="center">
    <div class="phase" id="phase">专注</div>
    <div class="clock" id="clock">25:00</div>
  </div>
</div>

<div class="row">
  <button id="btn-toggle">开始</button>
  <button id="btn-reset" class="tonal">重置</button>
  <button id="btn-skip" class="tonal">跳过</button>
</div>

<div class="card">
  <h2>时长</h2>
  <div class="lengths" id="lengths"></div>
</div>

<div class="status">
  <span class="chip" id="stat-completed">已完成 0 轮</span>
  <span class="chip" id="stat-state">未开始</span>
</div>

<footer>
  计时用的是「实际经过了多少秒」，不是「每秒减一」：WebView 在后台会被系统降频，
  固定每秒减一的写法会让计时越走越慢，切出去再回来发现根本没走完。
  已完成的轮数存在宿主存储里。
</footer>

<script src="timer.js"></script>
<script src="app.js"></script>
</body>
</html>
