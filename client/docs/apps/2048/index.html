<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2048</title>
<style>
  /* ==========================================================================
     2048 —— LemonLite 小程序
     --------------------------------------------------------------------------
     方块颜色不写死色值，而是按「越大越显眼」的顺序映射到宿主主题的颜色角色
     （surface-container → secondary → tertiary → primary → error → inverse）。
     这样在深色模式、动态壁纸色下都自动协调。
     ========================================================================== */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--md-surface, #fef7ff);
    color: var(--md-on-surface, #1d1b20);
    font-family: -apple-system, "Roboto", "Noto Sans SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    /* 滑动时不要触发浏览器的下拉刷新 / 横向回退 */
    overscroll-behavior: none;
    touch-action: pan-y;
  }

  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .muted { color: var(--md-on-surface-variant, #49454f); font-size: 13px; margin: 0; }

  .scores { display: flex; gap: 8px; margin: 14px 0 0; }

  .score {
    flex: 1;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--md-surface-container, #f3edf7);
  }
  .score .label { font-size: 12px; color: var(--md-on-surface-variant, #49454f); }
  .score .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .board-wrap { position: relative; margin-top: 12px; }

  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 8px;
    border-radius: 16px;
    background: var(--md-surface-container-highest, #e6e0e9);
    aspect-ratio: 1 / 1;
    user-select: none;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--md-surface-container-low, #f7f2fa);
    color: var(--md-on-surface, #1d1b20);
    transition: background-color .12s ease, color .12s ease;
  }
  .cell.empty { background: var(--md-surface-container-low, #f7f2fa); }
  .cell.d3 { font-size: 22px; }
  .cell.d4 { font-size: 18px; }

  /* 数值 → 颜色角色。
     刻意让「浅底 / 深底」交替，而不是按色调一路加深 —— 一路加深的话
     2（surface-container-high）和 4（surface-container-highest）只差一档色调，
     在手机上几乎分不出来，而它们恰恰是开局最常见的两个数。 */
  .cell.v2    { background: var(--md-surface-container-high, #ece6f0); color: var(--md-on-surface, #1d1b20); }
  .cell.v4    { background: var(--md-secondary-container, #e8def8); color: var(--md-on-secondary-container, #4a4459); }
  .cell.v8    { background: var(--md-secondary, #625b71); color: var(--md-on-secondary, #ffffff); }
  .cell.v16   { background: var(--md-tertiary-container, #ffd8e4); color: var(--md-on-tertiary-container, #31111d); }
  .cell.v32   { background: var(--md-tertiary, #7d5260); color: var(--md-on-tertiary, #ffffff); }
  .cell.v64   { background: var(--md-primary-container, #eaddff); color: var(--md-on-primary-container, #21005d); }
  .cell.v128  { background: var(--md-primary, #6750a4); color: var(--md-on-primary, #ffffff); }
  .cell.v256  { background: var(--md-error-container, #f9dedc); color: var(--md-on-error-container, #410e0b); }
  .cell.v512  { background: var(--md-error, #b3261e); color: var(--md-on-error, #ffffff); }
  .cell.v1024 { background: var(--md-inverse-surface, #322f35); color: var(--md-on-inverse-surface, #f5eff7); }
  .cell.v2048 { background: var(--md-inverse-primary, #d0bcff); color: var(--md-inverse-surface, #322f35); }
  /* 4096 以上和 2048 同底，靠一圈内描边区分（内描边不影响布局尺寸） */
  .cell.vbig  { background: var(--md-inverse-primary, #d0bcff); color: var(--md-inverse-surface, #322f35);
                box-shadow: inset 0 0 0 2px var(--md-error, #b3261e); }

  .cell.pop { animation: pop .16s ease-out; }
  @keyframes pop {
    from { transform: scale(.82); }
    to   { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell.pop { animation: none; }
    .cell { transition: none; }
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    background: var(--md-surface-container, #f3edf7);
    opacity: .96;
  }
  .overlay.show { display: flex; }
  .overlay .big { font-size: 24px; font-weight: 600; }

  .row { display: flex; gap: 8px; margin-top: 12px; }

  button {
    flex: 1;
    padding: 12px 16px;
    font: inherit;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    background: var(--md-primary, #6750a4);
    color: var(--md-on-primary, #fff);
  }
  button.tonal {
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }
  button:disabled { opacity: .45; }

  #no-bridge {
    display: none;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: var(--md-tertiary-container, #ffd8e4);
    color: var(--md-on-tertiary-container, #31111d);
  }

  footer { margin-top: 18px; font-size: 12px; color: var(--md-on-surface-variant, #49454f); }
</style>
</head>
<body>

<h1>2048</h1>
<p class="muted">手指滑动或按方向键。最高分会存进宿主的本地存储。</p>

<div id="no-bridge">未检测到 window.lemonlite —— 最高分不会被保存，其余玩法不变。</div>

<div class="scores">
  <div class="score"><div class="label">分数</div><div class="value" id="score">0</div></div>
  <div class="score"><div class="label">最高分</div><div class="value" id="best">0</div></div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <div class="overlay" id="overlay">
    <div class="big" id="overlay-text"></div>
    <div class="muted" id="overlay-sub"></div>
  </div>
</div>

<div class="row">
  <button id="btn-new">新游戏</button>
  <button id="btn-undo" class="tonal">撤销一步</button>
</div>

<footer>
  最高分保存在宿主存储里（按小程序 id 隔离），所以卸载重装 App 才会丢。
  撤销只保留一层 —— 无限撤销会让最高分失去意义。
</footer>

<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
