<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>二维码生成</title>
<style>
  /* ==========================================================================
     二维码生成 —— LemonLite 小程序
     --------------------------------------------------------------------------
     配色全部走宿主注入的 --md-* 变量，跟随浅色/深色/动态壁纸色。
     唯一的例外是二维码画布本身（见 .qr-frame 的注释）。
     ========================================================================== */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--md-surface, #fef7ff);
    color: var(--md-on-surface, #1d1b20);
    font-family: -apple-system, "Roboto", "Noto Sans SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .muted { color: var(--md-on-surface-variant, #49454f); font-size: 13px; margin: 0; }

  .card {
    background: var(--md-surface-container, #f3edf7);
    border-radius: 16px;
    padding: 16px;
    margin: 14px 0 0;
  }

  label.field { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

  textarea {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    padding: 12px;
    font: inherit;
    font-size: 14px;
    color: var(--md-on-surface, #1d1b20);
    background: var(--md-surface-container-highest, #e6e0e9);
    border: 1px solid var(--md-outline-variant, #cac4d0);
    border-radius: 12px;
    outline: none;
  }
  textarea:focus { border-color: var(--md-primary, #6750a4); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  button {
    flex: 1 1 auto;
    min-width: 88px;
    padding: 11px 16px;
    font: inherit;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    background: var(--md-primary, #6750a4);
    color: var(--md-on-primary, #fff);
  }
  button.tonal {
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }

  /* 二维码必须保持纯黑白：扫描器对低对比度很敏感，若跟随主题（深色模式下
     on-surface 是浅紫、surface 是深紫）识别率会明显下降。这是有意保留的例外。 */
  .qr-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: #ffffff;
    border-radius: 16px;
    margin-top: 12px;
    min-height: 200px;
  }
  #qr { display: block; width: 100%; max-width: 320px; height: auto; image-rendering: pixelated; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: var(--md-secondary-container, #e8def8);
    color: var(--md-on-secondary-container, #4a4459);
  }
  .chip.warn {
    background: var(--md-error-container, #f9dedc);
    color: var(--md-on-error-container, #410e0b);
  }

  #error {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: var(--md-error-container, #f9dedc);
    color: var(--md-on-error-container, #410e0b);
  }

  #no-bridge {
    display: none;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: var(--md-tertiary-container, #ffd8e4);
    color: var(--md-on-tertiary-container, #31111d);
  }

  footer { margin-top: 18px; font-size: 12px; color: var(--md-on-surface-variant, #49454f); }
</style>
</head>
<body>

<h1>二维码生成</h1>
<p class="muted">输入任意文本即时生成二维码。编码器内置在本页，不依赖任何外部脚本，离线可用。</p>

<div id="no-bridge">未检测到 window.lemonlite —— 你可能是用普通浏览器打开了这个页面，功能仍可用，只是不会跟随宿主主题。</div>

<div class="card">
  <label class="field" for="text">内容</label>
  <textarea id="text" placeholder="输入要编码的文本或网址…"></textarea>

  <div class="row">
    <button id="btn-clear" class="tonal">清空</button>
    <button id="btn-sample" class="tonal">填入示例网址</button>
  </div>

  <div class="qr-frame">
    <canvas id="qr" width="320" height="320"></canvas>
  </div>

  <div class="meta" id="meta"></div>
  <div id="error"></div>
</div>

<footer>
  纠错等级 M（约 15% 冗余）。纯数字 / 大写字母内容如果用专业库会走更紧凑的编码模式，
  这里统一按 UTF-8 字节编码，所以体积会略大一些 —— 换来的是实现简单、行为可预期。
</footer>

<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
