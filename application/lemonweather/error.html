<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网络未连接</title>
    <!-- 独立页面：不依赖外部字体，断网时也能正常显示 -->
    <style>
        :root {
            --md-primary: #6750A4;
            --md-on-surface: #1C1B1F;
            --md-surface: #FFFBFE;
            --md-surface-container: #F3EDF7;
            --md-shape-xl: 28px;
            --md-easing-emphasized: cubic-bezier(0.3, 0, 0.8, 0.15);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --md-primary: #D0BCFF;
                --md-on-surface: #E6E1E5;
                --md-surface: #1C1B1F;
                --md-surface-container: #211F26;
            }
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--md-surface);
            color: var(--md-on-surface);
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            padding: 24px;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 360px;
            width: 100%;
            animation: fade-in .5s var(--md-easing-emphasized);
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .error-icon-box {
            width: 88px;
            height: 88px;
            margin-bottom: 24px;
            border-radius: var(--md-shape-xl);
            background: color-mix(in srgb, var(--md-primary) 12%, transparent);
            color: var(--md-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .error-icon-box svg {
            width: 48px;
            height: 48px;
            position: relative;
            z-index: 1;
        }
        .error-icon-box::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--md-shape-xl);
            background: radial-gradient(circle at 50% 30%,
                color-mix(in srgb, var(--md-primary) 20%, transparent) 0%,
                transparent 70%);
            pointer-events: none;
        }
        .title {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.25px;
            margin-bottom: 8px;
        }
        .sub {
            font-size: 14px;
            font-weight: 400;
            opacity: .7;
            line-height: 1.5;
        }
        .retry-hint {
            margin-top: 20px;
            font-size: 12px;
            opacity: .5;
        }
        .retry-hint a {
            color: var(--md-primary);
            text-decoration: underline;
            cursor: pointer;
        }
        @media (max-width: 420px) {
            .error-icon-box { width: 72px; height: 72px; margin-bottom: 20px; }
            .title { font-size: 22px; }
            .sub { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="error-icon-box" role="img" aria-label="网络错误">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 8.5A15.08 15.08 0 0 1 12 3a15.08 15.08 0 0 1 10 5.5"/>
                <path d="M5 12.5A10.44 10.44 0 0 1 12 8.75a10.44 10.44 0 0 1 7 3.75"/>
                <path d="M8.5 16.5A5.54 5.54 0 0 1 12 14.5a5.54 5.54 0 0 1 3.5 2"/>
                <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
                <line x1="4" y1="4" x2="20" y2="20" stroke-width="2"/>
            </svg>
        </div>
        <h1 class="title">网络未连接</h1>
        <p class="sub">请检查网络连接，或稍后重试</p>
        <p class="retry-hint"><a onclick="location.replace('index.html')">重试打开</a></p>
    </div>
</body>
</html>
